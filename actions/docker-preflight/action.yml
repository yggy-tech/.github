name: docker-preflight
description: >-
  Fail fast with an actionable message when docker / buildx aren't usable on the
  runner, instead of dying deep inside a docker/* action. Add as the first step
  of a build job. Runs inline in the caller's job, so it checks the exact runner
  that will build.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -uo pipefail
        hint="If this is the self-hosted macOS runner, run the 'setup-runner-docker' workflow (colima + docker + buildx), or check 'brew services list' for colima."

        if ! command -v docker >/dev/null 2>&1; then
          echo "::error title=docker-preflight::'docker' not found on PATH. $hint"
          exit 1
        fi
        if ! docker version >/dev/null 2>&1; then
          echo "::error title=docker-preflight::docker CLI found but the daemon is unreachable. $hint"
          docker version || true
          exit 1
        fi
        if ! docker buildx version >/dev/null 2>&1; then
          echo "::error title=docker-preflight::docker buildx unavailable (the build needs buildx + GHA cache). $hint"
          exit 1
        fi
        echo "docker-preflight OK: $(docker --version); $(docker buildx version | head -1)"

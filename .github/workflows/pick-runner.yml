name: pick-runner
on:
  workflow_call:
    inputs:
      scope:
        description: Where the runner is registered — "org" or "repo"
        type: string
        default: repo
      org:
        description: Org login for scope=org (defaults to the caller's owner)
        type: string
        default: ${{ github.repository_owner }}
      match_label:
        description: Label that identifies your self-hosted runner
        type: string
        default: self-hosted
      self_hosted_labels:
        description: runs-on value (JSON) when the runner is available
        type: string
        default: '["self-hosted"]'
      fallback_labels:
        description: runs-on value (JSON) when it isn't
        type: string
        default: '"ubuntu-latest"'
      require_idle:
        description: also fall back when the runner is online but busy
        type: boolean
        default: false
    outputs:
      labels:
        description: runs-on value for downstream jobs
        value: ${{ jobs.pick.outputs.labels }}
    secrets:
      # Preferred: a GitHub App with org "Self-hosted runners: Read". Pass both.
      app_id:
        required: false
      app_private_key:
        required: false
      # Alternative: a PAT with the same read permission.
      runner_check_token:
        required: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      # Mint an org installation token when App creds are provided. Missing/bad
      # creds just fail this step (continue-on-error) and we fall back — the
      # pipeline never breaks on a runner-check failure.
      - id: apptoken
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.org }}
      - id: pick
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || secrets.runner_check_token }}
          SCOPE: ${{ inputs.scope }}
          ORG: ${{ inputs.org }}
          REPO: ${{ github.repository }}
          MATCH: ${{ inputs.match_label }}
          SELF: ${{ inputs.self_hosted_labels }}
          FALLBACK: ${{ inputs.fallback_labels }}
          REQUIRE_IDLE: ${{ inputs.require_idle }}
        run: |
          set -uo pipefail
          if [ "$SCOPE" = "org" ]; then
            endpoint="orgs/$ORG/actions/runners"
          else
            endpoint="repos/$REPO/actions/runners"
          fi
          filter='[.runners[] | select(.status=="online")'
          [ "$REQUIRE_IDLE" = "true" ] && filter="$filter | select(.busy==false)"
          filter="$filter | select([.labels[].name] | index(\"$MATCH\"))] | length"
          if [ "$SCOPE" = "org" ]; then
            perm="the org 'Self-hosted runners: Read' permission"
          else
            perm="the repo 'Administration: Read' permission"
          fi
          # Query runners, capturing stderr. A failure here (missing credential,
          # missing permission, bad token, API down) used to be swallowed and
          # was indistinguishable from "0 runners online". We now surface it as
          # a warning so the fallback is explainable — the pipeline still never
          # breaks on a runner check.
          err="$(mktemp)"
          raw="$(gh api "$endpoint" --paginate --jq "$filter" 2>"$err")"; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=pick-runner::runner check failed for $endpoint (gh exit $rc) -> $FALLBACK. Verify the app/token has $perm and can see the runner group."
            echo "gh api error: $(tr '\n' ' ' < "$err")"
            ready=0
          else
            # --paginate + `length` emits one count per page; sum them
            # (awk maps empty/non-numeric to 0).
            ready="$(printf '%s\n' "$raw" | awk '{ s += $1 } END { print s + 0 }')"
          fi
          rm -f "$err"
          if [ "$ready" -gt 0 ]; then
            echo "self-hosted runner available ($ready online, $SCOPE/$MATCH) -> $SELF"
            echo "labels=$SELF" >> "$GITHUB_OUTPUT"
          else
            echo "no online self-hosted runner ($SCOPE/$MATCH) -> $FALLBACK"
            echo "labels=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi

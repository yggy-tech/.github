name: pick-runner
on:
  workflow_call:
    inputs:
      scope:
        description: Where the runner is registered — "org" or "repo"
        type: string
        default: repo
      org:
        description: Org login for scope=org (defaults to the caller's owner)
        type: string
        default: ${{ github.repository_owner }}
      match_label:
        description: Label that identifies your self-hosted runner
        type: string
        default: self-hosted
      self_hosted_labels:
        description: runs-on value (JSON) when the runner is available
        type: string
        default: '["self-hosted"]'
      fallback_labels:
        description: runs-on value (JSON) when it isn't
        type: string
        default: '"ubuntu-latest"'
      require_idle:
        description: also fall back when the runner is online but busy
        type: boolean
        default: false
      app_id:
        description: GitHub App id to mint a token from (preferred over a PAT)
        type: string
        default: ""
    outputs:
      labels:
        description: runs-on value for downstream jobs
        value: ${{ jobs.pick.outputs.labels }}
    secrets:
      runner_check_token:
        # PAT alternative to the App. Optional — without any credential (or on
        # any API error) we degrade to the fallback runner, never fail the run.
        required: false
      app_private_key:
        description: Private key for app_id (required only if app_id is set)
        required: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      # Mint an org installation token when an App is configured. continue-on-error
      # keeps a bad/missing key from failing the pipeline — we just fall back.
      - id: apptoken
        if: inputs.app_id != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.org }}
      - id: pick
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || secrets.runner_check_token }}
          SCOPE: ${{ inputs.scope }}
          ORG: ${{ inputs.org }}
          REPO: ${{ github.repository }}
          MATCH: ${{ inputs.match_label }}
          SELF: ${{ inputs.self_hosted_labels }}
          FALLBACK: ${{ inputs.fallback_labels }}
          REQUIRE_IDLE: ${{ inputs.require_idle }}
        run: |
          set -uo pipefail
          if [ "$SCOPE" = "org" ]; then
            endpoint="orgs/$ORG/actions/runners"
          else
            endpoint="repos/$REPO/actions/runners"
          fi
          filter='[.runners[] | select(.status=="online")'
          [ "$REQUIRE_IDLE" = "true" ] && filter="$filter | select(.busy==false)"
          filter="$filter | select([.labels[].name] | index(\"$MATCH\"))] | length"
          # Any failure (no credential, bad token, API down) -> 0 -> fallback.
          ready="$(gh api "$endpoint" --paginate --jq "$filter" 2>/dev/null || true)"
          case "$ready" in ''|*[!0-9]*) ready=0 ;; esac
          if [ "$ready" -gt 0 ]; then
            echo "self-hosted runner available -> $SELF"
            echo "labels=$SELF" >> "$GITHUB_OUTPUT"
          else
            echo "no self-hosted runner ($SCOPE/$MATCH) -> $FALLBACK"
            echo "labels=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi
